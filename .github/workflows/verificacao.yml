# Verificação automática da plataforma.
#
# Roda a mesma bateria que se roda à mão antes de publicar, na ordem do mais
# barato para o mais caro: tipos, lint, testes, build e, por último, a fumaça —
# que sobe o servidor de verdade e navega por ele.
#
# Um trabalho só, e não vários em paralelo, de propósito: a fumaça precisa do
# build, e dividir obrigaria a instalar as dependências e construir duas vezes.
# O GitHub já mostra qual PASSO falhou, que é a informação que importa.
name: Verificação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificacao:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Banco descartável, criado do zero a cada execução.
      DATABASE_URL: file:${{ github.workspace }}/ci.db
      # O seed grava os arquivos de demonstração dentro do projeto; o servidor
      # precisa procurá-los no mesmo lugar para /api/files encontrá-los.
      STORAGE_DIR: ${{ github.workspace }}/storage/uploads
      ERROS_DIR: ${{ github.workspace }}/erros-ci
      NEXTAUTH_URL: http://localhost:3000
      # Valor descartável: esta instância existe por poucos minutos e não
      # guarda dado de ninguém. Nunca reutilize isto fora do CI.
      NEXTAUTH_SECRET: segredo-exclusivo-do-ci-sem-valor-fora-daqui
      # Teto baixo para a conferência do limitador ser rápida e evidente.
      ERROS_CLIENTE_LIMITE: "20"

    steps:
      # v5 nas duas: a v4 roda em Node 20, que os runners do GitHub já marcam
      # como obsoleto e forçam para o 24.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # O projeto declara Node >= 20.9. Usamos a LTS atual.
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      # ------------------------------------------------------------ fumaça

      - name: Preparar o banco da fumaça
        run: |
          npx prisma migrate deploy
          npx prisma db seed
          node scripts/preparar-fumaca.mjs >> "$GITHUB_ENV"

      - name: Subir o servidor
        run: |
          # Em segundo plano, com a saída guardada: se a fumaça falhar depois,
          # é neste arquivo que está o motivo.
          nohup npx next start -p 3000 > servidor.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/login; then
              echo "servidor no ar após ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "o servidor não respondeu em 60s:"
          cat servidor.log
          exit 1

      - name: Fumaça — proprietário
        env:
          FUMACA_EMAIL: ${{ env.FUMACA_ADMIN }}
          FUMACA_SENHA: Admin@123
          FUMACA_LIMITE: "90"
        run: node scripts/fumaca.mjs http://localhost:3000

      - name: Fumaça — funcionário
        env:
          FUMACA_EMAIL: ${{ env.FUMACA_FUNCIONARIO }}
          FUMACA_SENHA: Colaborador@123
          FUMACA_LIMITE: "90"
        run: node scripts/fumaca.mjs http://localhost:3000

      - name: Fumaça — rotas de API
        env:
          FUMACA_SENHA_ADMIN: Admin@123
          FUMACA_SENHA_FUNCIONARIO: Colaborador@123
        run: node scripts/fumaca-rotas.mjs http://localhost:3000

      - name: Conferir que o teto de avisos parou a gravação
        # O passo anterior disparou 45 avisos com o teto em 20. A resposta é
        # sempre 204, então só o arquivo prova que o limitador agiu.
        run: |
          registro=$(cat "$ERROS_DIR"/*.jsonl 2>/dev/null || true)

          # Conta SÓ os avisos que o teste disparou. O registro recebe qualquer
          # erro do servidor, e a primeira versão desta conferência exigia que o
          # arquivo INTEIRO tivesse 20 linhas — media a coisa errada, e por isso
          # falhou na estreia enquanto o limitador funcionava.
          avisos=$(printf '%s\n' "$registro" | grep -c "tela-de-teste" || true)
          outros=$(printf '%s\n' "$registro" | grep -v "tela-de-teste" | grep -c . || true)

          echo "avisos do teste registrados: $avisos (teto: $ERROS_CLIENTE_LIMITE)"
          echo "outras linhas no registro: $outros"

          # Erro da plataforma durante a fumaça é sinal diferente do teto, e
          # ainda não sabemos o que aparece aqui. Fica visível, sem reprovar —
          # quando estiver caracterizado, decide-se se deve derrubar o build.
          #
          # O resumo sai como ANOTAÇÃO, e não apenas no log: o log do Actions só
          # é legível por quem tem direitos de administração no repositório, e
          # quem investiga uma falha nem sempre tem. A anotação aparece na API
          # pública da execução.
          if [ "$outros" -gt 0 ]; then
            echo "::warning::a plataforma registrou $outros erro(s) fora do teste durante a fumaça"
            printf '%s\n' "$registro" | grep -v "tela-de-teste" \
              | node scripts/resumir-erros.mjs --anotacao
            echo "--- registro completo, sem os avisos do teste ---"
            printf '%s\n' "$registro" | grep -v "tela-de-teste" | head -20
          fi

          test "$avisos" -eq "$ERROS_CLIENTE_LIMITE"

      - name: Diagnóstico, se algo falhou
        if: failure()
        run: |
          echo "===== saída do servidor ====="
          cat servidor.log 2>/dev/null || echo "(o servidor não chegou a subir)"
          echo
          echo "===== erros registrados pela plataforma ====="
          cat "$ERROS_DIR"/*.jsonl 2>/dev/null || echo "(nenhum)"
